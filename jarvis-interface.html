<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Interface</title>
  <meta name="description" content="The JARVIS interface — an Iron Man-style dot-sphere assistant you can talk to.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cyan: #38e1ff;
      --cyan-soft: rgba(56, 225, 255, 0.55);
      --cyan-dim: rgba(56, 225, 255, 0.15);
      --bg: #02060a;
      --text: #cfeffb;
      --text-dim: #5b7d8c;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', -apple-system, sans-serif;
    }
    html, body { height: 100%; }
    body {
      background: radial-gradient(circle at 50% 45%, #06131c 0%, #02060a 60%, #01040700 100%), var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
      position: relative;
    }
    canvas#orb { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

    /* HUD overlay */
    .hud { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
    .hud .corner {
      position: absolute; font-family: var(--mono); font-size: 0.7rem;
      color: var(--text-dim); letter-spacing: 0.15em; text-transform: uppercase;
    }
    .tl { top: 1.4rem; left: 1.4rem; }
    .tr { top: 1.4rem; right: 1.4rem; text-align: right; }
    .bl { bottom: 6.5rem; left: 1.4rem; }

    .status-line { color: var(--cyan); }
    .agent-row { display: flex; align-items: center; gap: 0.4rem; margin-top: 0.35rem; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan); animation: blink 2.4s ease-in-out infinite; }
    .agent-row:nth-child(2) .dot { animation-delay: .3s; }
    .agent-row:nth-child(3) .dot { animation-delay: .6s; }
    .agent-row:nth-child(4) .dot { animation-delay: .9s; }
    @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }

    .center-label {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; z-index: 2; pointer-events: none; width: 90%;
    }
    .center-label .greeting {
      font-family: var(--mono); font-size: clamp(1.1rem, 3vw, 1.6rem);
      letter-spacing: 0.35em; text-transform: uppercase; color: var(--cyan);
      text-shadow: 0 0 24px var(--cyan-soft); opacity: 0.92;
    }
    .center-label .sub {
      margin-top: 0.6rem; font-size: 0.82rem; color: var(--text-dim);
      font-family: var(--mono); letter-spacing: 0.1em; min-height: 1.2em;
    }

    /* Command bar */
    .command-bar {
      position: fixed; bottom: 1.6rem; left: 50%; transform: translateX(-50%);
      width: min(620px, 92vw); z-index: 3;
      display: flex; align-items: center; gap: 0.6rem;
      background: rgba(6, 20, 28, 0.72);
      border: 1px solid var(--cyan-dim);
      border-radius: 999px; padding: 0.55rem 0.65rem 0.55rem 1.1rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 40px rgba(56, 225, 255, 0.08), inset 0 0 20px rgba(56,225,255,0.04);
    }
    .command-bar input {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text); font-family: var(--mono); font-size: 0.9rem;
    }
    .command-bar input::placeholder { color: var(--text-dim); }
    .btn {
      width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--cyan-dim);
      background: rgba(56,225,255,0.06); color: var(--cyan); cursor: pointer;
      display: grid; place-items: center; transition: all .2s ease; flex-shrink: 0;
    }
    .btn:hover { background: rgba(56,225,255,0.16); border-color: var(--cyan-soft); box-shadow: 0 0 18px var(--cyan-dim); }
    .btn.listening { background: var(--cyan); color: #02060a; box-shadow: 0 0 26px var(--cyan-soft); animation: pulseBtn 1.1s ease-in-out infinite; }
    @keyframes pulseBtn { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }

    .back { position: fixed; top: 1.4rem; left: 50%; transform: translateX(-50%);
      z-index: 4; pointer-events: auto; font-family: var(--mono); font-size: 0.72rem;
      color: var(--text-dim); text-decoration: none; letter-spacing: 0.12em; }
    .back:hover { color: var(--cyan); }

    @media (max-width: 640px) {
      .tr, .tl { font-size: 0.6rem; }
      .bl { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="orb"></canvas>

  <a href="jarvis-os.html" class="back">‹ ARCHITECTURE</a>

  <div class="hud">
    <div class="corner tl">
      <div class="status-line">JARVIS · ONLINE</div>
      <div style="margin-top:.35rem">SYS 18%&nbsp;&nbsp;GPU 09%&nbsp;&nbsp;MEM ✓</div>
      <div>13 ACTIVE MEMORIES</div>
    </div>
    <div class="corner tr">
      <div class="status-line">AGENTS</div>
      <div class="agent-row"><span class="dot"></span> RESEARCH</div>
      <div class="agent-row"><span class="dot"></span> CODE · CLAUDE</div>
      <div class="agent-row"><span class="dot"></span> BROWSER · AGY</div>
      <div class="agent-row"><span class="dot"></span> FINANCE</div>
    </div>
    <div class="corner bl">
      <div>REMOTE LINK · PHONE PAIRED</div>
      <div style="margin-top:.3rem">LONG-TERM MEMORY · ENGAGED</div>
    </div>
  </div>

  <div class="center-label">
    <div class="greeting" id="greeting">JARVIS</div>
    <div class="sub" id="sub">Standing by.</div>
  </div>

  <div class="command-bar">
    <input id="cmd" type="text" placeholder="Speak or type a command…  e.g. “Book a table for two at 8pm”" autocomplete="off">
    <button class="btn" id="mic" title="Voice">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
    </button>
    <button class="btn" id="send" title="Send">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <script>
  // ---------- JARVIS dot-sphere ----------
  const canvas = document.getElementById('orb');
  const ctx = canvas.getContext('2d');
  let W, H, DPR, cx, cy, R;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * DPR;
    H = canvas.height = innerHeight * DPR;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    cx = W / 2; cy = H / 2;
    R = Math.min(W, H) * 0.24;
  }
  window.addEventListener('resize', resize);
  resize();

  // Fibonacci sphere of points
  const N = 900;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const phi = i * Math.PI * (3 - Math.sqrt(5));
    pts.push({ x: Math.cos(phi) * r, y: y, z: Math.sin(phi) * r });
  }

  // State: idle=0, listening=1, speaking=2
  let mode = 0;
  let energy = 0;        // eased toward target
  let targetEnergy = 0;
  let t = 0;

  function project(p, ry, rx, rad) {
    // rotate around Y then X
    let x = p.x, y = p.y, z = p.z;
    let cosY = Math.cos(ry), sinY = Math.sin(ry);
    let x1 = x * cosY - z * sinY;
    let z1 = x * sinY + z * cosY;
    let cosX = Math.cos(rx), sinX = Math.sin(rx);
    let y1 = y * cosX - z1 * sinX;
    let z2 = y * sinX + z1 * cosX;
    return { x: x1 * rad, y: y1 * rad, z: z2 };
  }

  function draw() {
    t += 0.016;
    energy += (targetEnergy - energy) * 0.08;

    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    const breathe = 1 + Math.sin(t * 1.4) * 0.02 + energy * 0.10;
    const rad = R * breathe;
    const ry = t * (0.25 + energy * 0.55);
    const rx = Math.sin(t * 0.3) * 0.35;

    // --- core glow ---
    const coreR = rad * (0.28 + energy * 0.12 + Math.sin(t * 3) * 0.02 * (0.3 + energy));
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 2.6);
    g.addColorStop(0, `rgba(140,240,255,${0.55 + energy * 0.35})`);
    g.addColorStop(0.4, `rgba(56,225,255,${0.18 + energy * 0.2})`);
    g.addColorStop(1, 'rgba(56,225,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, coreR * 2.6, 0, Math.PI * 2); ctx.fill();

    // --- dots ---
    for (let i = 0; i < N; i++) {
      const pr = project(pts[i], ry, rx, rad);
      const depth = (pr.z + rad) / (2 * rad); // 0 back .. 1 front
      const px = cx + pr.x;
      const py = cy + pr.y;
      const size = (0.6 + depth * 1.8) * DPR;
      const flick = 0.75 + 0.25 * Math.sin(t * 6 + i);
      const alpha = (0.08 + depth * 0.7) * flick * (0.7 + energy * 0.5);
      ctx.fillStyle = `rgba(56,225,255,${alpha})`;
      ctx.beginPath(); ctx.arc(px, py, size, 0, Math.PI * 2); ctx.fill();
    }

    // --- HUD rings ---
    ctx.globalCompositeOperation = 'source-over';
    for (let k = 0; k < 3; k++) {
      const rr = rad * (1.25 + k * 0.16);
      const spin = t * (0.4 - k * 0.15) * (k % 2 ? -1 : 1);
      ctx.strokeStyle = `rgba(56,225,255,${0.10 + energy * 0.12 - k * 0.02})`;
      ctx.lineWidth = 1 * DPR;
      ctx.beginPath();
      // dashed arc segments
      const segs = 40;
      for (let s = 0; s < segs; s++) {
        if (s % 3 === 0) continue;
        const a0 = spin + (s / segs) * Math.PI * 2;
        const a1 = spin + ((s + 1) / segs) * Math.PI * 2;
        ctx.moveTo(cx + Math.cos(a0) * rr, cy + Math.sin(a0) * rr * 0.42 + Math.sin(t) * 0);
      }
      // simpler: full thin ellipse
      ctx.beginPath();
      ctx.ellipse(cx, cy, rr, rr * 0.5, spin, 0, Math.PI * 2);
      ctx.stroke();
    }

    // --- scanning tick marks ---
    const tickR = rad * 1.45;
    ctx.strokeStyle = `rgba(56,225,255,${0.22 + energy * 0.2})`;
    ctx.lineWidth = 1.4 * DPR;
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 24) {
      const wob = 0.5 + 0.5 * Math.sin(t * 2 + a * 4);
      const inner = tickR;
      const outer = tickR + (4 + wob * 8) * DPR;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
      ctx.lineTo(cx + Math.cos(a) * outer, cy + Math.sin(a) * outer);
      ctx.stroke();
    }

    requestAnimationFrame(draw);
  }
  draw();

  // ---------- interaction ----------
  const greeting = document.getElementById('greeting');
  const sub = document.getElementById('sub');
  const cmd = document.getElementById('cmd');
  const mic = document.getElementById('mic');
  const send = document.getElementById('send');

  function setMode(m) {
    mode = m;
    targetEnergy = m === 0 ? 0 : m === 1 ? 1 : 0.6;
  }

  function typeOut(text, done) {
    sub.textContent = '';
    let i = 0;
    const iv = setInterval(() => {
      sub.textContent += text[i++] || '';
      if (i >= text.length) { clearInterval(iv); done && done(); }
    }, 26);
  }

  // Canned intent recognition — demo of the routing idea
  function respond(input) {
    const q = input.toLowerCase();
    let route = 'Routing to Brain…';
    let reply = 'Acknowledged. Dispatching agents.';
    if (/book|reserve|table|flight|hotel|appointment/.test(q)) {
      route = '→ Personal · Browser Agent'; reply = 'Finding options and preparing your booking. I\'ll confirm before I commit anything.';
    } else if (/estimate|cost|price|budget|how much/.test(q)) {
      route = '→ Research · Finance Agent'; reply = 'Gathering figures and building an estimate for you now.';
    } else if (/build|code|app|website|fix|deploy/.test(q)) {
      route = '→ Development · Claude Code'; reply = 'Planning the build. I\'ll write, test, and commit, then report back.';
    } else if (/research|find|paper|learn|read/.test(q)) {
      route = '→ Research · Browser + PDF Agent'; reply = 'Searching sources and summarizing. Saving notes to memory.';
    } else if (/remember|note|remind/.test(q)) {
      route = '→ Memory Agent'; reply = 'Stored to long-term memory. I won\'t forget.';
    } else if (/install|update|open|system/.test(q)) {
      route = '→ Linux · Terminal Agent'; reply = 'Handling it on the desktop. Will ask before anything destructive.';
    }
    greeting.textContent = route;
    setMode(2);
    typeOut(reply, () => setTimeout(() => { greeting.textContent = 'JARVIS'; sub.textContent = 'Standing by.'; setMode(0); }, 2600));
  }

  function submit() {
    const v = cmd.value.trim();
    if (!v) return;
    cmd.value = '';
    setMode(1);
    greeting.textContent = 'PROCESSING';
    typeOut('“' + v + '”', () => setTimeout(() => respond(v), 500));
  }

  send.addEventListener('click', submit);
  cmd.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

  // Web Speech API voice input (where supported)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null;
  if (SR) {
    recog = new SR();
    recog.continuous = false; recog.interimResults = false; recog.lang = 'en-US';
    recog.onresult = e => { cmd.value = e.results[0][0].transcript; submit(); };
    recog.onend = () => { mic.classList.remove('listening'); if (mode === 1 && !cmd.value) setMode(0); };
  }
  mic.addEventListener('click', () => {
    if (recog) {
      mic.classList.add('listening');
      setMode(1); greeting.textContent = 'LISTENING'; sub.textContent = '';
      try { recog.start(); } catch (_) {}
    } else {
      // no speech API — just focus input and pulse
      setMode(1); greeting.textContent = 'LISTENING';
      typeOut('Voice not supported in this browser — type instead.', () => setMode(0));
      cmd.focus();
    }
  });

  // gentle idle intro
  setTimeout(() => typeOut('Good to see you. How can I help?'), 700);
  </script>
</body>
</html>
